# The macOS build (macos/): builds the app and runs its tests on every push and pull request.
# The fork publishes no build: no artifact, no release. A push to master or a macos-v* tag puts the app in a
# private repository instead, named by the variable BUILDS_REPO and written with the secret BUILDS_TOKEN.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Use Xcode 26.0.1, as the macOS build is developed with (the image's default, 16.4, lacks std::stop_token)
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream (to check upstream's sources are upstream's, plus macos/upstream-changes.txt)
        run: |
          git remote add upstream https://github.com/notepad-plus-plus/notepad-plus-plus.git
          git fetch --no-tags upstream master

      - name: Cache the Wine headers download
        uses: actions/cache@v4
        with:
          path: macos/build/wine/*.tar.xz
          key: wine-${{ hashFiles('macos/runtime/wine/WineHeaders.cmake') }}

      - name: Build and test
        run: macos/ci/build-and-test.sh macos/build

      # Never for a pull request, and only where BUILDS_REPO is set (a fork of this fork has no such variable).
      - name: Keep the app in the private builds repository
        if: github.event_name == 'push' && vars.BUILDS_REPO != '' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/macos-v'))
        env:
          GH_TOKEN: ${{ secrets.BUILDS_TOKEN }}
          BUILDS_REPO: ${{ vars.BUILDS_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::The secret BUILDS_TOKEN is not set"; exit 1; fi
          ditto -c -k --keepParent macos/build/app/*.app Notepad++-macOS.zip
          notes="Built from $GITHUB_REPOSITORY@$GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" Notepad++-macOS.zip -R "$BUILDS_REPO" --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release view latest-master -R "$BUILDS_REPO" > /dev/null 2>&1 ||
              gh release create latest-master -R "$BUILDS_REPO" --title "Latest master build" --latest=false --notes "$notes"
            gh release upload latest-master Notepad++-macOS.zip -R "$BUILDS_REPO" --clobber
            gh release edit latest-master -R "$BUILDS_REPO" --notes "$notes"
          fi
